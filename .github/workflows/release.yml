name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $py  = (Select-String -Path app/version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $py) {
            Write-Host "::error::Тег ($tag) не совпадает с app/version.py ($py)"
            exit 1
          }
          Write-Host "Версия $py совпадает с тегом."

      - name: Build with PyInstaller
        run: python -m PyInstaller build.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          $iss = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iss)) { throw "ISCC.exe not found" }
          & $iss "installer\setup.iss"

      - name: List build outputs
        shell: pwsh
        run: |
          Write-Host "--- dist ---"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZapretManager-Setup-*.exe
            dist/ZapretManager/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false